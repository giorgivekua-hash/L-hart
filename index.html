<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>For My Girl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap">
<style>
  /* Layout: one centered stage over a soft pink sky with floating hearts */
  :root {
    --sky-1: #ffe3ef;
    --sky-2: #ffd0e4;
    --sky-3: #fbe7ff;
    --rose: #ff4f93;
    --rose-deep: #e0306f;
    --blush: #ffb3cf;
    --ink: #7a2348;
    --card: rgba(255, 255, 255, 0.78);
    --gold: #ffd36e;
    --font-script: "Pacifico", "Brush Script MT", cursive;
    --font-body: "Quicksand", "Segoe UI", "Trebuchet MS", sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.7) 0, transparent 35%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,.6) 0, transparent 40%),
      linear-gradient(135deg, var(--sky-1), var(--sky-2) 50%, var(--sky-3));
    background-size: 200% 200%;
    animation: skyShift 14s ease-in-out infinite alternate;
  }

  @keyframes skyShift {
    from { background-position: 0% 0%; }
    to   { background-position: 100% 100%; }
  }

  /* ---------- floating background hearts ---------- */
  #bg-hearts, #roses {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  #bg-hearts { z-index: 0; }
  #roses { z-index: 1; }

  .float-heart {
    position: absolute;
    bottom: -40px;
    color: var(--blush);
    opacity: .7;
    animation: floatUp linear forwards;
    filter: drop-shadow(0 2px 3px rgba(224,48,111,.15));
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .75; }
    50%  { transform: translateY(-55vh) translateX(25px) rotate(12deg); }
    100% { transform: translateY(-115vh) translateX(-20px) rotate(-10deg); opacity: 0; }
  }

  /* corner sparkles */
  .sparkle {
    position: fixed;
    z-index: 0;
    color: #fff;
    font-size: 22px;
    text-shadow: 0 0 10px #fff, 0 0 18px var(--blush);
    animation: twinkle 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .3; transform: scale(.8) rotate(0deg); }
    50%      { opacity: 1;  transform: scale(1.15) rotate(20deg); }
  }

  /* ---------- stage ---------- */
  .stage {
    position: relative;
    z-index: 2;
    height: 100%;
    display: grid;
    place-items: center;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ---------- question card ---------- */
  .card {
    position: relative;
    width: min(440px, 100%);
    padding: 44px 28px 34px;
    text-align: center;
    background: var(--card);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 2px solid rgba(255,255,255,.9);
    border-radius: 32px;
    box-shadow:
      0 20px 50px rgba(224, 48, 111, .22),
      inset 0 0 0 6px rgba(255, 179, 207, .25);
    transform: scale(0) rotate(-8deg);
    opacity: 0;
  }
  .card.show { animation: popIn .9s cubic-bezier(.2, 1.6, .4, 1) forwards; }
  .card.hide { animation: popOut .6s ease-in forwards; }

  @keyframes popIn {
    0%   { transform: scale(0) rotate(-8deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes popOut {
    0%   { transform: scale(1); opacity: 1; }
    30%  { transform: scale(1.06); opacity: 1; }
    100% { transform: scale(0) rotate(10deg); opacity: 0; }
  }

  /* little bow on top of the card */
  .bow {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 84px;
    height: 54px;
  }

  .tiny-hearts {
    font-size: 16px;
    letter-spacing: 8px;
    color: var(--rose);
    margin-bottom: 10px;
    opacity: 0;
    animation: fadeUp .6s ease .7s forwards;
  }

  .question {
    font-family: var(--font-script);
    font-weight: 400;
    font-size: clamp(26px, 7vw, 36px);
    line-height: 1.35;
    color: var(--rose-deep);
    margin: 0 0 28px;
    text-wrap: balance;
    text-shadow: 0 3px 0 rgba(255, 179, 207, .6);
    min-height: 2.7em;
  }
  .question .word {
    display: inline-block;
    opacity: 0;
    transform: translateY(14px) scale(.8);
    animation: wordIn .5s cubic-bezier(.2, 1.4, .4, 1) forwards;
  }
  @keyframes wordIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    opacity: 0;
  }
  .buttons.show { animation: fadeUp .6s ease forwards; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .btn {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 19px;
    min-width: 130px;
    padding: 14px 28px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .btn-yes {
    color: #fff;
    background: linear-gradient(135deg, #ff7eb3, var(--rose) 60%, var(--rose-deep));
    box-shadow: 0 8px 0 #c42462, 0 12px 24px rgba(224,48,111,.35);
    --grow: 1;
    transform: scale(var(--grow));
    animation: wiggle 2.2s ease-in-out 2.8s infinite;
  }
  .btn-yes:hover { transform: translateY(-3px) scale(calc(var(--grow) * 1.05)); }
  .btn-yes:active { transform: translateY(5px); box-shadow: 0 3px 0 #c42462; }

  .btn-no {
    color: var(--rose-deep);
    background: #fff;
    box-shadow: 0 8px 0 var(--blush), 0 12px 20px rgba(224,48,111,.15);
  }
  .btn-no:hover { transform: translateY(-2px); }
  .btn-no:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--blush); }

  @keyframes wiggle {
    0%, 85%, 100% { transform: scale(var(--grow)) rotate(0); }
    88% { transform: scale(calc(var(--grow) * 1.05)) rotate(-6deg); }
    92% { transform: scale(calc(var(--grow) * 1.05)) rotate(6deg); }
    96% { transform: scale(var(--grow)) rotate(-3deg); }
  }

  /* ---------- the big heart ---------- */
  .heart-scene {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .heart-wrap {
    position: relative;
    width: min(340px, 82vw);
    text-align: center;
  }
  .heart-svg {
    width: 100%;
    height: auto;
    overflow: visible;
    transform: scale(0);
    filter: drop-shadow(0 18px 30px rgba(224, 48, 111, .45));
  }
  .heart-scene.show .heart-svg {
    animation:
      heartPop 1s cubic-bezier(.2, 1.7, .4, 1) forwards,
      heartbeat 1.3s ease-in-out 1.2s infinite;
  }
  @keyframes heartPop {
    0%   { transform: scale(0) rotate(-15deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.08); }
    30% { transform: scale(.98); }
    45% { transform: scale(1.06); }
  }

  .stitch {
    stroke-dasharray: 6 7;
    animation: stitchMove 6s linear infinite;
  }
  @keyframes stitchMove { to { stroke-dashoffset: -130; } }

  .glow-ring {
    position: absolute;
    left: 50%;
    top: 42%;
    width: 120%;
    aspect-ratio: 1;
    max-width: 100vw;
    transform: translate(-50%, -50%) scale(0);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.9) 0, rgba(255,179,207,.55) 35%, transparent 68%);
    z-index: -1;
  }
  .heart-scene.show .glow-ring { animation: ringIn 1.2s ease-out .2s forwards, ringPulse 2.6s ease-in-out 1.4s infinite; }
  @keyframes ringIn { to { transform: translate(-50%, -50%) scale(1); } }
  @keyframes ringPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    50% { transform: translate(-50%, -50%) scale(1.08); opacity: .75; }
  }

  .orbit {
    position: absolute;
    left: 50%;
    top: 42%;
    width: 0;
    height: 0;
    opacity: 0;
  }
  .heart-scene.show .orbit { animation: fadeIn .8s ease 1s forwards, spin 9s linear 1s infinite; }
  .orbit span {
    position: absolute;
    font-size: 20px;
    color: #fff;
    text-shadow: 0 0 8px var(--rose), 0 0 14px #fff;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { to { opacity: 1; } }

  .love-text {
    margin-top: 18px;
    font-family: var(--font-script);
    font-size: clamp(26px, 7.5vw, 38px);
    color: var(--rose-deep);
    text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(224,48,111,.25);
    opacity: 0;
  }
  .love-sub {
    margin-top: 6px;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: .04em;
    color: var(--ink);
    opacity: 0;
  }
  .heart-scene.show .love-text { animation: fadeUp .8s ease 1.1s forwards; }
  .heart-scene.show .love-sub  { animation: fadeUp .8s ease 1.6s forwards; }

  /* ---------- falling roses & petals ---------- */
  .rose {
    position: absolute;
    top: -60px;
    animation: fall linear forwards;
    filter: drop-shadow(0 4px 5px rgba(150, 20, 60, .25));
  }
  .petal {
    position: absolute;
    top: -30px;
    border-radius: 80% 0 80% 0;
    background: linear-gradient(135deg, #ff8fb8, var(--rose-deep));
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    8%   { opacity: 1; }
    25%  { transform: translateY(28vh) translateX(30px) rotate(90deg); }
    50%  { transform: translateY(56vh) translateX(-25px) rotate(200deg); }
    75%  { transform: translateY(84vh) translateX(25px) rotate(290deg); }
    100% { transform: translateY(115vh) translateX(-10px) rotate(380deg); opacity: .9; }
  }

  /* ---------- error window ---------- */
  .error-overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: rgba(122, 35, 72, .25);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  .error-window {
    width: min(380px, 100%);
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(122, 35, 72, .35);
    border: 2px solid var(--blush);
    animation: errorIn .45s cubic-bezier(.2, 1.6, .4, 1), shake .5s ease .45s;
  }
  @keyframes errorIn {
    from { transform: scale(.4); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .error-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .03em;
    background: linear-gradient(90deg, var(--rose), #ff7eb3);
  }
  .error-dots { display: flex; gap: 6px; }
  .error-dots i {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(255,255,255,.75);
  }
  .error-body {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 22px 20px 8px;
    text-align: left;
  }
  .error-icon {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    background: var(--rose-deep);
    box-shadow: 0 4px 0 #a81f52;
  }
  .error-body h2 {
    margin: 0 0 6px;
    font-size: 18px;
    color: var(--rose-deep);
  }
  .error-body p {
    margin: 0;
    font-size: 15px;
    line-height: 1.5;
    font-weight: 600;
    color: var(--ink);
  }
  .error-code {
    display: block;
    margin-top: 8px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px;
    color: #b0507a;
  }
  .error-actions {
    display: flex;
    justify-content: flex-end;
    padding: 14px 20px 20px;
  }
  .error-actions .btn { font-size: 16px; min-width: 0; padding: 11px 24px; animation: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

  <div id="bg-hearts" aria-hidden="true"></div>
  <div id="roses" aria-hidden="true"></div>

  <span class="sparkle" style="top:8%; left:10%;" aria-hidden="true">✦</span>
  <span class="sparkle" style="top:14%; right:12%; animation-delay:.8s;" aria-hidden="true">✧</span>
  <span class="sparkle" style="bottom:12%; left:14%; animation-delay:1.4s;" aria-hidden="true">✧</span>
  <span class="sparkle" style="bottom:18%; right:9%; animation-delay:.4s;" aria-hidden="true">✦</span>

  <main class="stage">

    <!-- Question card -->
    <section class="card" id="card">
      <svg class="bow" viewBox="0 0 84 54" aria-hidden="true">
        <path d="M42 27 C30 6 6 2 6 22 C6 38 28 36 42 27Z" fill="#ff7eb3" stroke="#e0306f" stroke-width="2"/>
        <path d="M42 27 C54 6 78 2 78 22 C78 38 56 36 42 27Z" fill="#ff7eb3" stroke="#e0306f" stroke-width="2"/>
        <path d="M38 30 L30 52 L37 48 L41 53 L42 31Z" fill="#ff4f93"/>
        <path d="M46 30 L54 52 L47 48 L43 53 L42 31Z" fill="#ff4f93"/>
        <circle cx="42" cy="27" r="7" fill="#ff4f93" stroke="#e0306f" stroke-width="2"/>
        <ellipse cx="18" cy="18" rx="5" ry="3" fill="#fff" opacity=".6"/>
        <ellipse cx="66" cy="18" rx="5" ry="3" fill="#fff" opacity=".6"/>
      </svg>

      <div class="tiny-hearts" aria-hidden="true">♥ ♡ ♥</div>
      <h1 class="question" id="question"></h1>

      <div class="buttons" id="buttons">
        <button class="btn btn-yes" id="yesBtn" type="button">Yes 💖</button>
        <button class="btn btn-no" id="noBtn" type="button">No</button>
      </div>
    </section>

    <!-- Big heart (shown after Yes) -->
    <section class="heart-scene" id="heartScene" hidden>
      <div class="heart-wrap">
        <div class="glow-ring"></div>
        <div class="orbit" id="orbit" aria-hidden="true"></div>

        <svg class="heart-svg" viewBox="0 0 100 92" role="img" aria-label="A big pink heart">
          <defs>
            <radialGradient id="heartFill" cx="35%" cy="30%" r="75%">
              <stop offset="0%"  stop-color="#ffc2da"/>
              <stop offset="40%" stop-color="#ff6fa6"/>
              <stop offset="80%" stop-color="#ff3d86"/>
              <stop offset="100%" stop-color="#d42466"/>
            </radialGradient>
            <linearGradient id="heartEdge" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fff"/>
              <stop offset="100%" stop-color="#ffd36e"/>
            </linearGradient>
          </defs>

          <path d="M50 88 C50 88 4 60 4 30 C4 15 15 4 29 4 C39 4 46 10 50 18 C54 10 61 4 71 4 C85 4 96 15 96 30 C96 60 50 88 50 88 Z"
                fill="url(#heartFill)" stroke="url(#heartEdge)" stroke-width="2.5"/>

          <!-- stitched inner outline -->
          <path class="stitch"
                d="M50 80 C50 80 11 56 11 31 C11 19 20 11 30 11 C39 11 45 17 50 26 C55 17 61 11 70 11 C80 11 89 19 89 31 C89 56 50 80 50 80 Z"
                fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>

          <!-- glossy shine -->
          <ellipse cx="27" cy="24" rx="10" ry="6" fill="#fff" opacity=".55" transform="rotate(-30 27 24)"/>
          <circle cx="38" cy="16" r="2.2" fill="#fff" opacity=".8"/>

          <!-- tiny hearts inside -->
          <path d="M70 52 c0 0 -6 -3.6 -6 -7.4 c0 -2 1.5 -3.4 3.2 -3.4 c1.3 0 2.2 .8 2.8 1.8 c.6 -1 1.5 -1.8 2.8 -1.8 c1.7 0 3.2 1.4 3.2 3.4 c0 3.8 -6 7.4 -6 7.4z" fill="#fff" opacity=".7"/>
          <path d="M30 56 c0 0 -4 -2.4 -4 -5 c0 -1.3 1 -2.3 2.1 -2.3 c.9 0 1.5 .5 1.9 1.2 c.4 -.7 1 -1.2 1.9 -1.2 c1.1 0 2.1 1 2.1 2.3 c0 2.6 -4 5 -4 5z" fill="#fff" opacity=".6"/>

          <!-- center text -->
          <text x="50" y="50" text-anchor="middle" font-family="Pacifico, cursive" font-size="13" fill="#fff"
                style="paint-order: stroke;" stroke="#d42466" stroke-width=".8">Forever</text>
        </svg>
      </div>

      <div>
        <div class="love-text">You &amp; Me 💕</div>
        <div class="love-sub">For the rest of our lives</div>
      </div>
    </section>

  </main>

  <!-- "No" error window -->
  <div class="error-overlay" id="errorOverlay" hidden>
    <div class="error-window" role="alertdialog" aria-labelledby="errTitle" aria-describedby="errText">
      <div class="error-bar">
        <span>Heart.exe</span>
        <span class="error-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <div class="error-body">
        <div class="error-icon" aria-hidden="true">!</div>
        <div>
          <h2 id="errTitle">Error: Answer not found</h2>
          <p id="errText">
            The answer "No" does not exist.<br>
            Please choose a valid answer.
            <span class="error-code" id="errCode">ERROR 404: NO_NOT_FOUND</span>
          </p>
        </div>
      </div>
      <div class="error-actions">
        <button class="btn btn-yes" id="tryAgainBtn" type="button">Try again</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
